# Self-contained FTP/FTPS + SFTP + WebDAV smoke servers for the network layer.
# Usage:
#   docker compose -f tools/network-smoke/docker-compose.yml up -d
#   docker compose -f tools/network-smoke/docker-compose.yml down
# Seed data is mounted read-only from ./seed; generate it with make-seed.ps1.
#
# FTP/FTPS -> ftp://10.0.0.20:2121 (user: smoke / pass: smoke123)  plain + explicit TLS
# SFTP    -> ssh://10.0.0.20:2222  (user: smoke / pass: smoke123)  SFTP-only (ForceCommand)
# WebDAV  -> http://10.0.0.20:8081 (user: user / pass: pass)       Basic auth, read-only
#
# Env-gated smoke tests in tests/ connect to these when the *_SMOKE_* vars are set
# (see tests/FtpSmokeTests.cs / SftpSmokeTests.cs).
#
# NOTE: WebDAV is commented out by default — uncomment the webdav service to start it.

services:
  ftp:
    # vsftpd-based image: supports REST STREAM (seekable FTP) + TLS.
    image: fauria/vsftpd:latest
    container_name: xfiles-smoke-ftp
    # Copy the TLS-enabled conf into place, then run the image's normal entrypoint
    # (which appends the runtime env vars and starts vsftpd).
    entrypoint: [ "/bin/bash", "-c", "cp /certs/vsftpd.conf /etc/vsftpd/vsftpd.conf && /usr/sbin/run-vsftpd.sh" ]
    ports:
      - "2121:21"
      - "30000-30010:30000-30010"
    environment:
      FTP_USER: smoke
      FTP_PASS: smoke123
      # Must be the host's LAN IP when testing from another device (Xbox).
      # PASV replies announce this address; 127.0.0.1 makes remote clients
      # try to connect to themselves. Set to ${SMOKE_PASV_ADDRESS:-10.0.0.20}.
      PASV_ADDRESS: ${SMOKE_PASV_ADDRESS:-10.0.0.20}
      PASV_MIN_PORT: 50100
      PASV_MAX_PORT: 50200
      REVERSE_LOOKUP_ENABLE: "NO"
      # TLS: self-signed cert (see certs/). Explicit FTPS on port 21 via AUTH TLS.
      # ValidateAnyCertificate accepts the self-signed cert client-side.
      TLS_CERT: /certs/vsftpd.crt
      TLS_KEY: /certs/vsftpd.key
    volumes:
      # Seed mounted writable so the FTP write-back smoke test can STOR into
      # the FTP home; the test deletes its own file afterwards.
      - ./seed:/home/vsftpd/smoke
      # vsftpd.conf with TLS enabled (certs/vsftpd.conf) replaces the image
      # default; the wrapper entrypoint copies it then the image entrypoint
      # appends the runtime env vars on top.
      - ./certs/vsftpd.conf:/certs/vsftpd.conf:ro
      - ./certs:/certs:ro
    restart: "no"

  sftp:
    # OpenSSH server exposing the sftp subsystem — doubles as the SSH + SFTP test server.
    # OpenSSH ChrootDirectory %h REQUIRES the chroot dir (home) owned by root and
    # not user-writable — do NOT chown /home/smoke (it makes sshd abort every
    # connection). The write-back smoke test writes into /home/smoke/uploads
    # (seed mount is :ro). After `up -d` run once:
    #   docker compose -f tools/network-smoke/docker-compose.yml exec sftp \
    #     sh -c "mkdir -p /home/smoke/uploads && chown smoke:group_1000 /home/smoke/uploads"
    image: atmoz/sftp:latest
    container_name: xfiles-smoke-sftp
    ports:
      - "2222:22"
    command: "smoke:smoke123:1000:1000"
    volumes:
      - ./seed:/home/smoke/share:rw
    restart: "no"

  webdav:
    # nginx-based WebDAV server with Basic authentication (maltokyo image).
    image: maltokyo/docker-nginx-webdav:latest
    container_name: xfiles-smoke-webdav
    ports:
      - "8081:80"
    environment:
      USERNAME: user
      PASSWORD: pass
    volumes:
      - ./seed:/media/data:rw
    restart: "no"
